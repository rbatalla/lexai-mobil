<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D0F14">
<title>LEXAI Mòbil</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="styles.css?v=195">
</head>
<body>
<div id="app">

  <header>
    <div class="brand">
      <div class="brand-title" id="brand-title" role="button" tabindex="0">LEX<span class="ai">AI</span> Mòbil</div>
      <div style="display:flex; gap:8px;">
        <button class="btn-icon" id="btn-foto-llibre" title="Afegir foto de llibre" aria-label="Afegir foto de llibre"></button>
        <button class="btn-icon" id="btn-importar" title="Descarregar dades" aria-label="Descarregar dades" style="position:relative;"></button>
        <button class="btn-icon" id="btn-config-github" title="Configurar adreça GitHub" aria-label="Configurar adreça GitHub"></button>
        <button class="btn-icon" id="btn-forcar-update" title="Forçar actualització de l'app" aria-label="Forçar actualització"></button>
        <button class="btn-icon" id="btn-minimitzar" title="Minimitzar" aria-label="Minimitzar"></button>
      </div>
    </div>
    <div class="mes-nav" id="mes-nav" style="display:none;">
      <button id="btn-mes-ant" aria-label="Mes anterior"></button>
      <div class="mes-label" id="mes-label">—</div>
      <button id="btn-mes-seg" aria-label="Mes següent"></button>
      <button class="btn-nova-previsio" id="btn-nova-previsio" title="Nova previsió aquest mes"
              aria-label="Nova previsió aquest mes" style="display:none;">+</button>
    </div>
    <div class="tbr-filtres" id="tbr-filtres" style="display:none;"></div>
    <div id="sagues-filtres" style="display:none;">
      <div class="tbr-filtres" id="sagues-filtres-tipus"></div>
      <div class="tbr-filtres" id="sagues-filtres-estat" style="margin-top:6px;"></div>
    </div>
  </header>

  <main id="main"></main>

  <input type="file" id="input-csv" accept=".csv,text/csv">
  <div class="toast oculta" id="toast"></div>
  <div class="modal-overlay oculta" id="modal-info">
    <div class="modal-caixa">
      <div class="modal-titol">LEXAI Mòbil</div>
      <div class="modal-linia" id="modal-versio">Versió —</div>
      <div class="modal-linia">Creador: Ramon Batalla</div>
      <div class="modal-separador"></div>
      <div class="modal-linia discreta" id="modal-n-previsions">— previsions carregades</div>
      <div class="modal-linia discreta" id="modal-data-carrega">Darrera actualització: —</div>
      <button id="btn-tancar-modal">D'acord</button>
    </div>
  </div>

  <div class="modal-overlay oculta" id="modal-foto-llibre">
    <div class="modal-foto-cos">
      <div class="modal-foto-header">
        <button class="btn-icon" id="btn-foto-tancar" aria-label="Tancar"></button>
        <div class="modal-foto-titol" id="foto-pas-titol">Cerca el llibre</div>
        <button class="btn-icon" id="btn-foto-pujar" title="Pujar les fotos pendents a GitHub ara" aria-label="Pujar ara"></button>
      </div>

      <div class="foto-pas" id="foto-pas-cercar">
        <input type="text" id="foto-cerca-input" class="foto-cerca-input" placeholder="Cerca un llibre per títol o autor..." autocomplete="off">
        <div class="foto-cerca-resultats" id="foto-cerca-resultats"></div>
      </div>

      <div class="foto-pas oculta" id="foto-pas-tipus">
        <div class="foto-llibre-sel" id="foto-llibre-sel"></div>
        <div class="foto-tipus-graella" id="foto-tipus-graella"></div>
        <button class="btn-secundari foto-btn-pujar" id="btn-foto-pujar-ara" style="margin-top:16px; width:100%;"></button>
      </div>

      <div class="foto-pas oculta" id="foto-pas-retall">
        <div class="crop-wrapper" id="crop-wrapper">
          <div class="crop-viewport" id="crop-viewport">
            <img id="crop-img" draggable="false" alt="">
            <div class="crop-rect" id="crop-rect">
              <div class="crop-handle crop-handle--nw" data-handle="nw"></div>
              <div class="crop-handle crop-handle--ne" data-handle="ne"></div>
              <div class="crop-handle crop-handle--sw" data-handle="sw"></div>
              <div class="crop-handle crop-handle--se" data-handle="se"></div>
            </div>
          </div>
        </div>
        <div class="foto-retall-hint">Arrossega les cantonades per ajustar el retall (no cal mantenir proporcions) o el centre per moure'l.</div>
        <div class="foto-retall-accions">
          <button class="btn-secundari" id="btn-foto-repetir">Repetir foto</button>
          <button class="btn-marcar" id="btn-foto-confirmar">Fer servir aquesta foto</button>
        </div>
      </div>
    </div>
  </div>
  <input type="file" id="input-foto-llibre" accept="image/*" capture="environment" style="display:none;">

  <div class="bottom-nav">
    <button class="nav-item actiu" id="nav-previsions" data-tab="previsions"></button>
    <button class="nav-item" id="nav-sagues" data-tab="sagues"></button>
    <button class="nav-item" id="nav-tbr" data-tab="tbr"></button>
    <button class="nav-item" id="nav-reptes" data-tab="reptes"></button>
    <button class="nav-item" id="nav-cites" data-tab="cites"></button>
    <button class="nav-item" id="nav-pomodoro" data-tab="pomodoro"></button>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="app.js?v=195"></script>
</body>
</html>
