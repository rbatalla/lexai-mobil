<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D0F14">
<title>LEXAI Mòbil</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="styles.css?v=168">
</head>
<body>
<div id="app">

  <header>
    <div class="brand">
      <div class="brand-title" id="brand-title" role="button" tabindex="0">LEX<span class="ai">AI</span> Mòbil</div>
      <div style="display:flex; gap:8px;">
        <button class="btn-icon" id="btn-importar" title="Descarregar dades" aria-label="Descarregar dades" style="position:relative;"></button>
        <button class="btn-icon" id="btn-config-github" title="Configurar adreça GitHub" aria-label="Configurar adreça GitHub"></button>
        <button class="btn-icon" id="btn-forcar-update" title="Forçar actualització de l'app" aria-label="Forçar actualització"></button>
        <button class="btn-icon" id="btn-minimitzar" title="Minimitzar" aria-label="Minimitzar"></button>
      </div>
    </div>
    <div class="mes-nav" id="mes-nav" style="display:none;">
      <button id="btn-mes-ant" aria-label="Mes anterior"></button>
      <div class="mes-label" id="mes-label">—</div>
      <button id="btn-mes-seg" aria-label="Mes següent"></button>
    </div>
    <div class="tbr-filtres" id="tbr-filtres" style="display:none;"></div>
  </header>

  <main id="main"></main>

  <input type="file" id="input-csv" accept=".csv,text/csv">
  <div class="toast oculta" id="toast"></div>
  <div class="modal-overlay oculta" id="modal-info">
    <div class="modal-caixa">
      <div class="modal-titol">LEXAI Mòbil</div>
      <div class="modal-linia" id="modal-versio">Versió —</div>
      <div class="modal-linia">Creador: Ramon Batalla</div>
      <div class="modal-separador"></div>
      <div class="modal-linia discreta" id="modal-n-previsions">— previsions carregades</div>
      <div class="modal-linia discreta" id="modal-data-carrega">Darrera actualització: —</div>
      <button id="btn-tancar-modal">D'acord</button>
    </div>
  </div>

  <div class="bottom-nav">
    <button class="nav-item actiu" id="nav-previsions" data-tab="previsions"></button>
    <button class="nav-item" id="nav-sagues" data-tab="sagues"></button>
    <button class="nav-item" id="nav-tbr" data-tab="tbr"></button>
    <button class="nav-item" id="nav-reptes" data-tab="reptes"></button>
    <button class="nav-item" id="nav-pomodoro" data-tab="pomodoro"></button>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="app.js?v=168"></script>
</body>
</html>
